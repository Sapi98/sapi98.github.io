name: Update Google Scholar statistics

on:
  schedule:
    - cron: "17 8 1 * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-scholar-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fetch Google Scholar statistics
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: node scripts/update-scholar-stats.mjs

      - name: Commit changed statistics
        run: |
          if git diff --quiet scholar-stats.json; then
            echo "Scholar statistics have not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scholar-stats.json
          git commit -m "Update Google Scholar statistics"
          git push